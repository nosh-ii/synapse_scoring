<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Synapse • BOA Scoring (v1.0)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <img src="https://cdn.nest.rip/uploads/264bcf7e-9781-4d7c-933d-0a116ccfcd02.png" alt="Synapse logo" class="logo">
        <div class="title-area">
          <h1>Synapse</h1>
          <div class="subtitle">BOA Regional — GE 60 / Visual 20 / Music 20 · v1.0</div>
        </div>
      </div>
      <div class="header-right">
        <input id="searchInput" placeholder="Search bands..." />
        <label class="finals-label">Finalists (Top)
          <input id="finalsX" type="number" min="0" value="5" />
        </label>
        <button id="addBandBtn" class="btn primary">+ Add Band</button>
        <div class="small-controls">
          <button id="exportJSON" class="btn">Export</button>
          <button id="importJSONBtn" class="btn">Import</button>
          <button id="exportCSV" class="btn">CSV</button>
          <button id="clearBtn" class="btn danger">Clear</button>
        </div>
      </div>
    </header>

    <img class="banner" src="https://cdn.nest.rip/uploads/b2dbf11f-492b-4f47-9eb4-bc45eb96207d.png" alt="banner">

    <main class="main">
      <aside class="left-panel">
        <div class="panel-head">Roster</div>
        <div id="cardsContainer" class="cards-container" ></div>
      </aside>

      <section class="right-panel">
        <div class="panel-head">Selected Band</div>
        <div id="detailPanel" class="detail-panel empty">
          <div class="detail-empty">Select a band (or create a new one) to edit scores.</div>
        </div>

        <div class="finals-panel">
          <h3>Finals — Top <span id="finalsCountDisplay">5</span></h3>
          <div id="finalsList" class="finals-list"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div>Synapse — Local-first • BOA Modern • <strong>v1.0</strong></div>
      <div class="foot-right"><small>Saved in your browser · Export to share</small></div>
    </footer>
  </div>

  <input id="filePicker" type="file" accept=".json" style="display:none">

  <script src="app.js"></script>
</body>
</html>
